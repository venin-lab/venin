[package]
name = "venin"
description = "The Venin command line: the lab runner, genesis, verify and the agent check-up."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "2.6.0", default-features = false, features = ["consensus", "eips", "signer-local", "std"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5.8"
venin-core = { path = "../core" }
